name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Sign the app for TestFlight without uploading (export), or upload it (upload)"
        type: choice
        options: [none, export, upload]
        default: none

permissions:
  contents: read

env:
  # The release Xcode (scripts/select-xcode.sh). App Store Connect refuses builds made with a beta Xcode, so it's pinned:
  # when Apple ships a new release Xcode and the xcode-27 image has it, update this.
  RELEASE_XCODE: "27.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Build and test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select the release Xcode
        run: scripts/select-xcode.sh

      - name: Sentence bank is up to date
        # items.json is generated from tools/items_source.py; this fails if someone edited one without the other.
        run: |
          python3 tools/items_source.py
          git diff --exit-code OneOrMany/Resources/items.json

      - name: Test
        run: |
          # The first available iPhone simulator on this runner.
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS" in runtime:
                  for d in devices:
                      if d["name"].startswith("iPhone"):
                          print(d["udid"]); sys.exit()')"
          [ -n "$udid" ] || { echo "::error::No iPhone simulator on this runner"; exit 1; }
          xcodebuild test -project OneOrMany.xcodeproj -scheme OneOrMany -destination "id=$udid" CODE_SIGNING_ALLOWED=NO

  testflight:
    name: Upload to TestFlight
    # Every release tag; by hand with the workflow's "testflight" input.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.testflight != 'none')
    needs: test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select the release Xcode
        run: scripts/select-xcode.sh

      # An App Manager API key can't use cloud-managed signing, so the Apple Distribution certificate comes from a
      # secret; with the key, testflight.sh makes the App Store profile for it, signs manually and uploads.
      - name: Import the Apple Distribution certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          identity="$(scripts/import-certificate.sh "Apple Distribution")"
          # The team is the identity's last part: "Apple Distribution: Name (TEAMID)".
          team="$(sed -n 's/.*(\([A-Z0-9]\{10\}\))$/\1/p' <<< "$identity")"
          [ -n "$team" ] || { echo "::error::No team ID in \"$identity\""; exit 1; }
          echo "DEVELOPMENT_TEAM=$team" >> "$GITHUB_ENV"

      - name: Archive and upload
        env:
          API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          UPLOAD: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.testflight == 'upload') && '1' || '0' }}
        run: |
          export ASC_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$API_KEY" > "$ASC_KEY"
          # Releases take their version from the tag; other runs use Config/Version.xcconfig.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          DISTRIBUTION_CERTIFICATE=1 scripts/testflight.sh
          rm -f "$ASC_KEY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: OneOrMany-ipa
          path: build/testflight/*.ipa
          if-no-files-found: ignore

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
